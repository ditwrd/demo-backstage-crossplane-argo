apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: modules
  namespace: argo
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]

  generators:
    - git:
        repoURL: https://github.com/ditwrd/demo-backstage-crossplane-argo
        revision: HEAD
        directories:
          - path: "crossplane/modules/*"

  template:
    metadata:
      name: "{{index .path.segments 0}}-{{index .path.segments 1}}"
      labels:
        managed-by: applicationset
        app-type: demo-bca
      annotations:
        argocd.argoproj.io/manifest-generate-paths: ".;.."
        argocd.argoproj.io/compare-options: ServerSideDiff=true,IncludeMutationWebhook=true

    spec:
      project: demo-bca
      source:
        repoURL: https://github.com/ditwrd/demo-backstage-crossplane-argo
        targetRevision: HEAD
        path: "{{.path.path}}"
        directory:
          recurse: true
      destination:
        server: https://kubernetes.default.svc
        namespace: "{{.path.basenameNormalized}}"

      syncPolicy:
        automated:
          prune: true
          selfHeal: true
          allowEmpty: false
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
          - PrunePropagationPolicy=background
          - PruneLast=true
        retry:
          limit: 3
          backoff:
            duration: 10s
            factor: 2
            maxDuration: 2m
