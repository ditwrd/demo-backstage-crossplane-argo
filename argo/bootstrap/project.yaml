apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: demo-bca
  namespace: argo
spec:
  description: Demo Backstage Crossplane Argo
  sourceRepos:
    - "https://github.com/ditwrd/demo-backstage-crossplane-argo"
  destinations:
    - namespace: "*"
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: "*"
      kind: "*"
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
  orphanedResources:
    warn: true
