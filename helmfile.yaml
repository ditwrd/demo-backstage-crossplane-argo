repositories:
  - name: argo
    url: https://argoproj.github.io/argo-helm
  - name: crossplane
    url: https://charts.crossplane.io/stable
    
    
releases:
  - name: argo
    chart: argo/argo-cd
    version: 10.2.3
    namespace: argo
    createNamespace: true
    values:
      - configs:
          cm:
            resource.exclusions: |
              - apiGroups:
                - "*"
                kinds:
                - ProviderConfigUsage
            application.resourceTrackingMethod: annotation
          params:
            server.insecure: true
      - dex:
          enabled: false
  - name: crossplane
    chart: crossplane/crossplane
    version: 2.3.1
    namespace: crossplane-system
    createNamespace: true
          
helmDefaults:
  kubeContext: kind-demobca
