repositories:
  - name: argo
    url: https://argoproj.github.io/argo-helm
  - name: crossplane
    url: https://charts.crossplane.io/stable
  - name: sysbee
    url: https://charts.sysbee.io/stable/sysbee
    
    
releases:
  - name: argo
    chart: argo/argo-cd
    version: 10.2.3
    namespace: argo
    createNamespace: true
    values:
      - configs:
          cm:
            resource.exclusions: |
              - apiGroups:
                - "*"
                kinds:
                - ProviderConfigUsage
            application.resourceTrackingMethod: annotation
          params:
            server.insecure: true
      - dex:
          enabled: false
  - name: crossplane
    chart: crossplane/crossplane
    version: 2.3.1
    namespace: crossplane-system
    createNamespace: true
  - name: ministack
    namespace: ministack
    chart: sysbee/kubedeploy
    disableValidationOnInstall: true
    version: 1.2.2
    installed: true
    values:
      # one replica should be enough
      - replicaCount: 1
      # We wish to preserve Synthing data over restarts
      - deploymentMode: Statefulset
      - image:
          repository: ministackorg/ministack
          tag: 1.4.11-full
          pullPolicy: Always
      - env:
          - name: LOG_LEVEL
            value: DEBUG
      - ports:
          # Admin UI pot
          - name: http
            containerPort: 4566
            protocol: TCP
      # Enable healtchecks for automatic container restart if it stops responding
      - healthcheck:
          enabled: true
          probes:
            livenessProbe:
              tcpSocket:
                port: http
            readinessProbe:
              tcpSocket:
                port: http
      # Define service as NodePort, each Syncthing pod will need direct communication
      # with other peers. We explicitly skip opening Admin UI port via service
      - service:
          enabled: true
          type: ClusterIP
          ports:
            - port: 4566
              targetPort: http
              protocol: TCP
              name: http

helmDefaults:
  kubeContext: kind-demobca
