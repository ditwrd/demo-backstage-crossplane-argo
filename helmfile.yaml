repositories:
  - name: argo
    url: https://argoproj.github.io/argo-helm
  - name: crossplane
    url: https://charts.crossplane.io/stable
  - name: sysbee
    url: https://charts.sysbee.io/stable/sysbee
    
    
releases:
  - name: argo
    chart: argo/argo-cd
    version: 10.2.3
    namespace: argo
    createNamespace: true
    values:
      - configs:
          cm:
            resource.exclusions: |
              - apiGroups:
                - "*"
                kinds:
                - ProviderConfigUsage
            application.resourceTrackingMethod: annotation
          params:
            server.insecure: true
      - dex:
          enabled: false
  - name: crossplane
    chart: crossplane/crossplane
    version: 2.3.1
    namespace: crossplane-system
    createNamespace: true
  - name: ministack
    namespace: ministack
    chart: sysbee/kubedeploy
    disableValidationOnInstall: true
    version: 1.2.2
    installed: true
    values:
      # one replica should be enough
      - replicaCount: 1
      # We wish to preserve Synthing data over restarts
      - deploymentMode: Statefulset
      - image:
          repository: ministackorg/ministack
          tag: 1.4.11-full
          pullPolicy: Always
      - env:
          - name: LOG_LEVEL
            value: DEBUG
      - ports:
          # Admin UI pot
          - name: http
            containerPort: 4566
            protocol: TCP
      # Enable healtchecks for automatic container restart if it stops responding
      - healthcheck:
          enabled: true
          probes:
            livenessProbe:
              tcpSocket:
                port: http
            readinessProbe:
              tcpSocket:
                port: http
      # Define service as NodePort, each Syncthing pod will need direct communication
      # with other peers. We explicitly skip opening Admin UI port via service
      - service:
          enabled: true
          type: ClusterIP
          ports:
            - port: 4566
              targetPort: http
              protocol: TCP
              name: http
  # StackPort UI for ministack. Runs in-cluster so it never touches the local
  # AWS profile/SSO config. No custom image: uvx fetches stackport at start.
  - name: stackport
    namespace: ministack
    chart: sysbee/kubedeploy
    disableValidationOnInstall: true
    version: 1.2.2
    needs:
      - ministack/ministack
    values:
      - replicaCount: 1
      - image:
          repository: ghcr.io/astral-sh/uv
          tag: python3.13-bookworm-slim
          command: ["uvx"]
          args: ["stackport==0.3.8", "serve", "--port", "8080"]
      - env:
          - name: AWS_ENDPOINT_URL
            value: http://ministack-kubedeploy.ministack.svc.cluster.local:4566
          - name: AWS_ACCESS_KEY_ID
            value: test
          - name: AWS_SECRET_ACCESS_KEY
            value: test
          - name: AWS_REGION
            value: us-east-1
      - ports:
          - name: http
            containerPort: 8080
            protocol: TCP
      - healthcheck:
          enabled: true
          probes:
            livenessProbe:
              tcpSocket:
                port: http
            # uvx downloads stackport + deps on every pod start; allow ~5min
            startupProbe:
              tcpSocket:
                port: http
              periodSeconds: 5
              failureThreshold: 60
            readinessProbe:
              tcpSocket:
                port: http
      - service:
          enabled: true
          type: ClusterIP
          ports:
            - port: 8080
              targetPort: http
              protocol: TCP
              name: http

helmDefaults:
  kubeContext: kind-demobca
