apiVersion: aws.m.upbound.io/v1beta1
kind: ClusterProviderConfig
metadata:
  name: pod-identity
  namespace: crossplane-system
spec:
  credentials:
    source: Secret
    secretRef:
      name: aws-creds
      namespace: crossplane-system
      key: credentials
  endpoint:
    url:
      type: Static
      static: http://ministack-kubedeploy.ministack.svc.cluster.local:4566
---
apiVersion: v1
kind: Secret
metadata:
  name: aws-creds
  namespace: crossplane-system
type: Opaque
stringData:
  credentials: |
    [default]
    aws_access_key_id=ministack
    aws_secret_access_key=ministack
